name: 'OSV'

on:
  push:
    branches: ['master']
  schedule:
    - cron: '30 22 * * 5'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-full-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan-scheduled:
    uses: 'google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36' # v2.7.0
    permissions:
      actions: read
      security-events: write
      contents: read
